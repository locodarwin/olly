name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: make strict
      - run: make
      # pty-driven regression suite plus the differential replace-all fuzz.
      - run: make test
      # Allocation-failure sweep: every allocation failed in turn, the
      # editor must survive or exit through die().
      - run: make test-oom
      # Failure-injection check for the durable-save fsync path.
      - run: make test-io
